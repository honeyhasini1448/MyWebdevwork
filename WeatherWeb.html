<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWeb</title>
    <style>
        body{
            background-image: url(./WhatsApp\ Image\ 2025-09-18\ at\ 3.01.15\ PM.jpeg);
            height: 100hv;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: cursive;
            background-size: cover;

        }
        .web{
            background: linear-gradient(to right,rgb(17, 219, 172),rgb(55, 152, 232)) ;
            max-width: 500; 
            position: relative;
            top: 50px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: black 10px 10px 30px;
            text-align: center;
            
        }
        button{
            background-color: black;
            height:30px;
            width: 100px;
            color: white;
            border: none;
            padding: 5px;
            border-radius:7px;
        }
        input{

            padding: 10px;
            width: 90%;
            border: 1px solid black;
            margin-bottom: 15px;

        }

    </style>
</head>
<body>
    <div class="web">
    <h1>Weather Web</h1>
    <input type="text" id="city" placeholder="Enter City Name">
    <button onclick="getWeather()">Get Weather</button>
    <div id="result"></div>
    </div>

     <script>
        
        async function getWeather(){

        let city = document.getElementById("city").value

        if(!city){
            alert(`Please Enter City Name`)
            return;
        }
         
        const apiKey = `7baedf95c394f45accb45ff5053d8092` 
        let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=7baedf95c394f45accb45ff5053d8092&units=metric`
        
        try{
            let response = await fetch(url)
            let data = await response.json()

            console.log(data)

            if(data.cod !==200){
                throw new Error(data.message)
            }else{

            document.getElementById("result").innerHTML = 
            `<h4>${data.name}</h4>
            <h3>${data.main.temp}</h3>
            <p>${data.weather[0].description}</p>`
            }

         }catch(error){

            document.getElementById(`result`).innerHTML = ` <p>Error:${error.message}<p>`
        }
    }

    </script>
</body>
</html>
